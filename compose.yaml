name: gryt-ai-chat-bot

services:
  gryt-ai-chat-bot:
    build:
      context: .
      args:
        ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-codex}
    container_name: gryt-ai-chat-bot
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    environment:
      GRYT_HOST: ${GRYT_HOST:?set Gryt server host}
      GRYT_NICKNAME: ${GRYT_NICKNAME:-AI Chat}
      ASSISTANT_PROVIDER: ${ASSISTANT_PROVIDER:-codex}
      ASSISTANT_MODEL: ${ASSISTANT_MODEL:-}
      HISTORY_TTL_HOURS: ${HISTORY_TTL_HOURS:-168}
      HISTORY_CACHE_ENABLED: ${HISTORY_CACHE_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GRYT_IDENTITY_PATH: /data/ai-chat-bot-identity.json
      CODEX_HOME: /data/codex
    volumes:
      - gryt-ai-chat-bot-data:/data

volumes:
  gryt-ai-chat-bot-data:
    external: true
    name: gryt-ai-chat-bot_gryt-ai-chat-bot-data
