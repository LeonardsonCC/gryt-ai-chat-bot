services:
  gryt-codex-bot:
    build: .
    container_name: gryt-codex-bot
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
      - apparmor:unconfined
    cap_add:
      - SYS_ADMIN
    environment:
      GRYT_HOST: ${GRYT_HOST:?set Gryt server host}
      GRYT_NICKNAME: ${GRYT_NICKNAME:-Codex}
      CODEX_MODEL: ${CODEX_MODEL:-gpt-6-luna}
      GRYT_IDENTITY_PATH: /data/gryt-bot-identity.json
      CODEX_HOME: /data/codex
    volumes:
      - gryt-codex-data:/data

volumes:
  gryt-codex-data:
